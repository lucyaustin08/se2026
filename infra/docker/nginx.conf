server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # API calls go to the backend container on the shared network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is a client-side route: serve the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
