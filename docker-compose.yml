# Run the whole app: docker compose up --build
# Then open http://localhost:8080 (app) or http://localhost:8000/docs (API docs).
#
# First, copy .env.example to .env next to this file and set POSTGRES_PASSWORD. Never commit
# the .env file.

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://roadhouse:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/roadhouse
      # Adds a made-up sample band on first start, for the sprint 1 user picker.
      SEED_SAMPLE_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - roadhouse
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      additional_contexts:
        infra: ./infra/docker
        backend: ./backend
    ports:
      - "8080:8080"
    networks:
      - roadhouse
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # PostgreSQL. It isn't published on a host port: only the backend talks to it.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: roadhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: roadhouse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - roadhouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadhouse -d roadhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

networks:
  roadhouse:
