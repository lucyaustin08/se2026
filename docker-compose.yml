# Run the whole app: docker compose up --build
# Then open http://localhost:8080 (app) or http://localhost:8000/docs (API docs).

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/roadhouse.db
      # For PostgreSQL, use the db service below instead:
      # DATABASE_URL: postgresql+psycopg://roadhouse:${POSTGRES_PASSWORD}@db:5432/roadhouse
    volumes:
      - roadhouse-data:/data
    ports:
      - "8000:8000"
    networks:
      - roadhouse
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      additional_contexts:
        infra: ./infra/docker
    ports:
      - "8080:8080"
    networks:
      - roadhouse
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # PostgreSQL, for when the team moves off SQLite. Set POSTGRES_PASSWORD in a .env file
  # next to this compose file (never commit it), and add psycopg to the backend.
  # db:
  #   image: postgres:17
  #   environment:
  #     POSTGRES_USER: roadhouse
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: roadhouse
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - roadhouse
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U roadhouse"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

volumes:
  roadhouse-data:
  # postgres-data:

networks:
  roadhouse:
