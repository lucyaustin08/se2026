[project]
name = "roadhouse-backend"
version = "0.1.0"
description = "Roadhouse API: gigs, members, setlists and charts for a working band."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (replaces isort)
    "B",    # bugbear
    "UP",   # pyupgrade: flags deprecated syntax
    "SIM",  # simplifications
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make Ruff treat the alembic package as ours.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["app"]
branch = true
