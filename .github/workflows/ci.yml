name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANNOTATE: ../.github/scripts/annotate.sh
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: $ANNOTATE "Install Python" uv python install

      - name: Install dependencies from uv.lock
        run: $ANNOTATE "uv sync" uv sync --locked

      - name: Ruff lint
        run: $ANNOTATE "Ruff lint" uv run ruff check .

      - name: Ruff format check
        run: $ANNOTATE "Ruff format" uv run ruff format --check .

      - name: mypy (strict)
        run: $ANNOTATE "mypy" uv run mypy

      - name: Tests with coverage
        run: >-
          $ANNOTATE "pytest" uv run pytest --cov=app --cov-report=term-missing:skip-covered
          --cov-fail-under=80
