name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANNOTATE: ../.github/scripts/annotate.sh
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: $ANNOTATE "Install Python" uv python install

      - name: Install dependencies from uv.lock
        run: $ANNOTATE "uv sync" uv sync --locked

      - name: Ruff lint
        run: $ANNOTATE "Ruff lint" uv run ruff check .

      - name: Ruff format check
        run: $ANNOTATE "Ruff format" uv run ruff format --check .

      - name: mypy (strict)
        run: $ANNOTATE "mypy" uv run mypy

      - name: Tests with coverage
        run: >-
          $ANNOTATE "pytest" uv run pytest --cov=app --cov-report=term-missing:skip-covered
          --cov-fail-under=80

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ANNOTATE: ../.github/scripts/annotate.sh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies from pnpm-lock.yaml
        run: $ANNOTATE "pnpm install" pnpm install --frozen-lockfile

      - name: ESLint
        run: $ANNOTATE "ESLint" pnpm lint

      - name: TypeScript
        run: $ANNOTATE "TypeScript" pnpm typecheck

      - name: Prettier check
        run: $ANNOTATE "Prettier" pnpm format:check

      - name: Tests with coverage
        run: $ANNOTATE "Vitest" pnpm test:cov

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ANNOTATE: .github/scripts/annotate.sh
    steps:
      - uses: actions/checkout@v5

      - name: Build and start both containers
        run: $ANNOTATE "docker compose up" docker compose up --build --detach --wait --wait-timeout 180

      - name: API answers through the frontend's nginx proxy
        run: $ANNOTATE "API via nginx" curl --fail --silent --show-error http://localhost:8080/api/v1/health

      - name: A client-side route serves the app
        run: >-
          $ANNOTATE "Frontend route" sh -c
          "curl --fail --silent --show-error http://localhost:8080/gigs | grep -q 'id=\"root\"'"

      - name: Container logs on failure
        if: failure()
        run: $ANNOTATE "docker compose logs" sh -c "docker compose logs --no-color --tail 60; exit 1"

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
